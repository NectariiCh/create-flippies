buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7.+'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

// Provides the createSrgToMcp task and dev-time refmap remapping, required to run
// dependency mods that ship mixins (Create, Power Grid, Architectury) in this
// workspace, and to build this mod's own mixin refmap.
apply plugin: 'org.spongepowered.mixin'

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {
    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            // Remap dependency-mod mixin refmaps (SRG names) to this workspace's official mappings
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')

            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        name = 'Create'
        url = 'https://maven.createmod.net'
    }
    maven {
        name = 'tterrag'
        url = 'https://maven.tterrag.com'
    }
    maven {
        name = 'Architectury'
        url = 'https://maven.architectury.dev/'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Generates this mod's mixin refmap at compile time (mixin itself ships with Forge)
    annotationProcessor "org.spongepowered:mixin:${mixin_version}:processor"

    // Create and its libraries
    implementation fg.deobf("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    implementation fg.deobf("net.createmod.ponder:Ponder-Forge-${minecraft_version}:${ponder_version}") { transitive = false }
    implementation fg.deobf("dev.engine-room.flywheel:flywheel-forge-${minecraft_version}:${flywheel_version}") { transitive = false }
    implementation fg.deobf("com.tterrag.registrate:Registrate:${registrate_version}")

    // Create: Power Grid (the mod this addon extends) and its Architectury runtime
    implementation fg.deobf("maven.modrinth:power-grid:${powergrid_version}")
    implementation fg.deobf("dev.architectury:architectury-forge:${architectury_version}")

    // Hypergraphical Lib, built from the local clone in hypergraphical-lib/ (see
    // settings.gradle). It is a source build in official mappings, so no fg.deobf.
    // Embeddium is its hard requirement and is only needed to run the game here.
    implementation "dev.nectariich.hypergraphical:hypergraphical:${hypergraphical_version}"
    runtimeOnly fg.deobf("maven.modrinth:embeddium:${embeddium_version}")

    // Unit tests. The PLC's emulator (content/plc/mcu) is pure Java, so its tests run
    // on the plain JUnit platform with no game or mod loader behind them.
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // Power Grid shades its matrix library (EJML) inside its own jar, where Gradle cannot
    // see it; the circuit tests solve real Power Grid networks, so they need it put back.
    testRuntimeOnly 'org.ejml:ejml-simple:0.44.0'
}

tasks.named('test', Test).configure {
    useJUnitPlatform {
        // the Linux boot (spec 12.11) needs the guest kernel built: run it with linuxTest
        excludeTags 'linux'
    }
    // Forge's union file system (securejarhandler), which ClasspathContentTest serves from, needs
    // what Forge's own launcher opens for it
    jvmArgs '--add-opens', 'java.base/java.lang.invoke=ALL-UNNAMED'
}

// The tests tagged "linux" (spec 12.11): the kernel and initramfs of guest/linux/build.sh and
// guest/linux/mkinitramfs.sh booted in the headless PC, skipped while they are not built. The
// run's transcript, screenshot and timings stay in build/linux-boot.
tasks.register('linuxTest', Test) {
    group = 'verification'
    description = 'Boots the guest/linux kernel in the headless PC (spec 12.11)'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'linux'
    }
    systemProperty 'java.awt.headless', 'true'
    testLogging.showStandardStreams = true
    // its inputs are the guest build's outputs, which Gradle does not track
    outputs.upToDateWhen { false }
    // NetinstallDebianTest installs from the mod jar (its floppy and its bundled internet); the
    // jar's resources take the guest outputs as inputs, so a rebuilt guest rebuilds it first
    dependsOn tasks.named('jar')
}

// The headless PC runner (spec 12.9): a PC outside Minecraft, COM1 on this terminal.
// ./gradlew -q --console=plain runHeadlessPc --args='--cpu 68040 --floppy boot.img'
// Options are listed at the top of HeadlessPc.java and by --args='--help'.
tasks.register('runHeadlessPc', JavaExec) {
    group = 'application'
    description = 'Runs a PC from content/computer without Minecraft (spec 12.9)'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.nectariich.create_flippies.content.computer.tools.HeadlessPc'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
    workingDir = projectDir
    standardInput = System.in
    jvmArgs '-Djava.awt.headless=true'
}

// guest/debian/build.sh --chunks writes out/chunks/debian.fdi.z/ (size.txt, 0.z, 1.z, ...);
// guest/netinstall's build writes out/netinstall.img; guest/apt/build.sh writes the package
// archive deb.flip serves to out/archive/ (dists/, pool/, pool-m68k/, the key)
def debianChunks = file('guest/debian/out/chunks')
def netinstallOut = file('guest/netinstall/out')
def aptArchive = file('guest/apt/out/archive')

// get.flip/index.txt (docs/PC_SPEC.md 12.4.3), listing every deflated .fdi image that is there to
// bundle: its size from size.txt, its title from the .fdi header in its first chunk.
tasks.register('internetIndex') {
    def out = layout.buildDirectory.dir('generated/internet')
    inputs.files(fileTree(debianChunks) { include '*.fdi.z/size.txt', '*.fdi.z/0.z' })
    outputs.dir(out)
    doLast {
        def root = out.get().asFile
        project.delete(root)
        def lines = ['# kind path size title (generated by the internetIndex task in build.gradle)']
        if (debianChunks.isDirectory()) {
            debianChunks.listFiles().findAll { it.name.endsWith('.fdi.z') }.sort { it.name }.each { dir ->
                def size = new File(dir, 'size.txt').text.trim() as long
                def head = new java.util.zip.InflaterInputStream(new File(dir, '0.z').newInputStream()).withCloseable {
                    it.readNBytes(84)
                }
                if (head.length < 84 || new String(head, 0, 4, 'US-ASCII') != 'FDI1')
                    throw new GradleException("${dir}: chunk 0 does not start with an FDI1 header")
                def title = new String(head, 20, 64, 'UTF-8').replace('\u0000', '').trim()
                lines << "image /${dir.name - '.z'} ${size} ${title ?: dir.name - '.z'}"
            }
        }
        def index = new File(root, 'data/create_flippies/internet/get.flip/index.txt')
        index.parentFile.mkdirs()
        index.text = lines.join('\n') + '\n'
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
            create_version_range: create_version_range, powergrid_version_range: powergrid_version_range,
            hypergraphical_version_range: hypergraphical_version_range,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }

    // The Blockbench exports the breaker models are cut from live beside the models
    // they produce, because that is where they are authored and re-exported. They
    // are not resources: Minecraft resource paths may hold only [a-z0-9/._-], so
    // every one of them is rejected by the loader with an ignorable error, and a
    // dozen of those at every startup is a dozen places for a real error to hide.
    // tools/gen_circuit_breaker.py reads them from the source tree, not from here.
    exclude 'assets/*/models/block/CB*-DIN-WO-*.json'

    // The network modem's bundled internet and the netinstall floppy (docs/PC_SPEC.md 12.4.3,
    // 12.5), taken from the guest builds' outputs when they exist. They are build outputs, not
    // sources, so they never go into src/main/resources (git); a build without them has a
    // catalogue without the image and a netinstall floppy that comes out blank.
    into('data/create_flippies/internet/get.flip') {
        from(debianChunks)
    }
    // Plain files, not deflated chunks: the .debs are compressed already, and apt's indexes are small
    into('data/create_flippies/internet/deb.flip') {
        from(aptArchive)
    }
    into('data/create_flippies/floppies') {
        from(netinstallOut) { include 'netinstall.img' }
    }
    from(tasks.named('internetIndex'))
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
