buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7.+'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

// Provides the createSrgToMcp task and dev-time refmap remapping, required to run
// dependency mods that ship mixins (Create, Power Grid, Architectury) in this
// workspace, and to build this mod's own mixin refmap.
apply plugin: 'org.spongepowered.mixin'

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {
    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            // Remap dependency-mod mixin refmaps (SRG names) to this workspace's official mappings
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')

            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        name = 'Create'
        url = 'https://maven.createmod.net'
    }
    maven {
        name = 'tterrag'
        url = 'https://maven.tterrag.com'
    }
    maven {
        name = 'Architectury'
        url = 'https://maven.architectury.dev/'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Generates this mod's mixin refmap at compile time (mixin itself ships with Forge)
    annotationProcessor "org.spongepowered:mixin:${mixin_version}:processor"

    // Create and its libraries
    implementation fg.deobf("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    implementation fg.deobf("net.createmod.ponder:Ponder-Forge-${minecraft_version}:${ponder_version}") { transitive = false }
    implementation fg.deobf("dev.engine-room.flywheel:flywheel-forge-${minecraft_version}:${flywheel_version}") { transitive = false }
    implementation fg.deobf("com.tterrag.registrate:Registrate:${registrate_version}")

    // Create: Power Grid (the mod this addon extends) and its Architectury runtime
    implementation fg.deobf("maven.modrinth:power-grid:${powergrid_version}")
    implementation fg.deobf("dev.architectury:architectury-forge:${architectury_version}")

    // Hypergraphical Lib, built from the local clone in hypergraphical-lib/ (see
    // settings.gradle). It is a source build in official mappings, so no fg.deobf.
    // Embeddium is its hard requirement and is only needed to run the game here.
    implementation "dev.nectariich.hypergraphical:hypergraphical:${hypergraphical_version}"
    runtimeOnly fg.deobf("maven.modrinth:embeddium:${embeddium_version}")

    // Unit tests. The PLC's emulator (content/plc/mcu) is pure Java, so its tests run
    // on the plain JUnit platform with no game or mod loader behind them.
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // Power Grid shades its matrix library (EJML) inside its own jar, where Gradle cannot
    // see it; the circuit tests solve real Power Grid networks, so they need it put back.
    testRuntimeOnly 'org.ejml:ejml-simple:0.44.0'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
            create_version_range: create_version_range, powergrid_version_range: powergrid_version_range,
            hypergraphical_version_range: hypergraphical_version_range,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }

    // The Blockbench exports the breaker models are cut from live beside the models
    // they produce, because that is where they are authored and re-exported. They
    // are not resources: Minecraft resource paths may hold only [a-z0-9/._-], so
    // every one of them is rejected by the loader with an ignorable error, and a
    // dozen of those at every startup is a dozen places for a real error to hide.
    // tools/gen_circuit_breaker.py reads them from the source tree, not from here.
    exclude 'assets/*/models/block/CB*-DIN-WO-*.json'
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
