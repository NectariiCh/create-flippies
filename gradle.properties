# Machine-specific: Gradle 8.8 cannot run on Java 25 (this machine's default java).
# Point Gradle at the installed JDK 17. If you move machines, adjust this path or
# move the line to %USERPROFILE%\.gradle\gradle.properties.
org.gradle.java.home=C:/Program Files/Java/jdk-17

org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

## Environment Properties
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.4.6
forge_version_range=[47,)
loader_version_range=[47,)
mapping_channel=official
mapping_version=1.20.1

## Dependency versions
# This is the exact set Create: Power Grid 0.6.0 (1.20.1 Forge) is built against.
create_version=6.0.7-281
create_version_range=[6.0.7,)
ponder_version=1.0.91
flywheel_version=1.0.5
registrate_version=MC1.20-1.3.3
architectury_version=9.2.14
# Modrinth *version id* of Create: Power Grid 0.6.0 for 1.20.1 Forge.
# The plain version number "0.6.0" is ambiguous on the Modrinth maven (it also
# matches the 1.21.1 NeoForge build), so the unique version id is used instead.
# Find ids for newer versions at https://modrinth.com/mod/power-grid/versions
powergrid_version=ZHqOfBhb
powergrid_version_range=[0.6.0,)
# Must match the mixin version Forge ships, so the refmap the annotation
# processor writes is readable by the loader at runtime.
mixin_version=0.8.5

## Mod Properties
mod_id=create_flippies
mod_name=Create: Flippies
mod_license=All Rights Reserved
mod_version=0.1.0
mod_group_id=com.nectariich.create_flippies
mod_authors=nectariich
mod_description=Create: Flippies, an addon for Create: Power Grid.
