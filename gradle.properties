# The Gradle daemon runs on JDK 21 (Stonecutter needs it), pinned by
# gradle/gradle-daemon-jvm.properties. Each node compiles with its own toolchain:
# Java 17 for 1.20.1-forge, Java 21 for 1.21.1-neoforge.

org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

## Mod Properties
## Loader and dependency versions differ per node and live in stonecutter.properties.toml.
mod_id=create_flippies
mod_name=Create: Flippies
mod_license=All Rights Reserved
mod_version=0.0.4.-2
mod_group_id=com.nectariich.create_flippies
mod_authors=nectariich
mod_description=Create: Flippies, an addon for Create: Power Grid.

# Hypergraphical Lib is built from the gitignored local clone in hypergraphical-lib/.
# Its coordinate is hypergraphical-<loader>:<this>+mc<minecraft_version>.
hypergraphical_version=0.1.0
hypergraphical_version_range=[0.1.0,)
