modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="create"
mandatory=true
versionRange="${create_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="powergrid"
mandatory=true
versionRange="${powergrid_version_range}"
ordering="AFTER"
side="BOTH"

# Renders the custom models the Design Workbench imports. Client only: it has no
# server half, and it in turn requires Embeddium.
[[dependencies.${mod_id}]]
modId="hypergraphical"
mandatory=true
versionRange="${hypergraphical_version_range}"
ordering="AFTER"
side="CLIENT"

# WIRE GAUGES: optional. When installed, its gauged wires replace Flippies' own copies
# (same ids under its namespace); Flippies registers none of its own and remaps them in saves.
[[dependencies.${mod_id}]]
modId="powerplantgrid"
mandatory=false
versionRange="*"
ordering="NONE"
side="BOTH"
