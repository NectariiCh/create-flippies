# Per-node properties, read by Stonecutter as ordinary Gradle properties.
# Mod metadata shared by both nodes lives in gradle.properties.

["1.20.1-forge"]
minecraft_version = "1.20.1"
minecraft_version_range = "[1.20.1,1.21)"
forge_version = "47.4.6"
forge_version_range = "[47,)"
loader_version_range = "[47,)"
# This is the exact set Create: Power Grid 0.6.0 (1.20.1 Forge) is built against.
create_version = "6.0.7-281"
create_version_range = "[6.0.7,)"
ponder_version = "1.0.91"
flywheel_version = "1.0.5"
registrate_version = "MC1.20-1.3.3"
architectury_version = "9.2.14"
# Modrinth *version id* of Create: Power Grid 0.6.0 for 1.20.1 Forge.
# The plain version number "0.6.0" is ambiguous on the Modrinth maven (it also
# matches the 1.21.1 NeoForge build), so the unique version id is used instead.
# Find ids for newer versions at https://modrinth.com/mod/power-grid/versions
powergrid_version = "ZHqOfBhb"
powergrid_version_range = "[0.6.0,)"
# Hypergraphical's hard client dependency; the same build its own dev run uses.
embeddium_version = "0.3.31+mc1.20.1"
# Must match the mixin version Forge ships, so the refmap the annotation
# processor writes is readable by the loader at runtime.
mixin_version = "0.8.5"

["1.21.1-neoforge"]
minecraft_version = "1.21.1"
minecraft_version_range = "[1.21.1,1.21.2)"
neoforge_version = "21.1.265"
# Create 6.0.10 needs 21.1.219 or newer
neoforge_version_range = "[21.1.219,)"
loader_version_range = "[4,)"
# Create 6.0.10 release (maven build 280 has the release's Git-Hash and a slim jar).
# Power Grid 0.6.2 requires create [6.0.9,6.1.0).
create_version = "6.0.10-280"
create_version_range = "[6.0.9,)"
# The versions Create 6.0.10 bundles in its jarjar
ponder_version = "1.0.82+mc1.21.1"
flywheel_version = "1.0.6"
# Only on https://maven.ithundxr.dev/snapshots
registrate_version = "MC1.21-1.3.0+67"
architectury_version = "13.0.11"
# Modrinth version id of Create: Power Grid 0.6.2 for 1.21.1 NeoForge
powergrid_version = "jCkPHjmP"
powergrid_version_range = "[0.6.0,)"
# Hypergraphical's hard client dependency on 1.21.1 (Embeddium 1.21.1 is abandoned).
# Modrinth version id of Sodium mc1.21.1-0.6.13-neoforge. Sodium 0.8 ships as a wrapper jar
# the dev loader skips, and Iris 1.8 pairs with Sodium 0.6.
sodium_version = "Pb3OXVqC"
