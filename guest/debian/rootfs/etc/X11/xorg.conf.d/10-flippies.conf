# Display 0 of the Create Flippies PC through flippiesfb: 640x480 at 8 bits pseudocolour, the
# driver's default mode (spec 12.15.1). Input comes from evdev through udev (the PS/2 keyboard and
# mouse as /dev/input/event*), as xserver-xorg-input-evdev's own 10-evdev.conf sets up.
Section "ServerFlags"
	Option "AutoAddGPU" "false"
	Option "BlankTime" "0"
	Option "StandbyTime" "0"
	Option "SuspendTime" "0"
	Option "OffTime" "0"
EndSection

# GLX is not loaded: there is no 3D on this machine and Mesa costs memory and start-up time.
# Composite is off (nothing here uses it). RENDER stays on although its start-up in 8-bit
# pseudocolour takes about a minute at 25 MHz (it searches the palette for each of 32768 colours):
# without it JWM draws its text with Xft on the client, which keeps the CPU busy all the time.
Section "Extensions"
	Option "COMPOSITE" "Disable"
EndSection

Section "Module"
	Disable "glx"
EndSection

Section "Device"
	Identifier "flippies-display-0"
	Driver "fbdev"
	Option "fbdev" "/dev/fb0"
EndSection

Section "Monitor"
	Identifier "flippies-monitor"
EndSection

Section "Screen"
	Identifier "flippies-screen"
	Device "flippies-display-0"
	Monitor "flippies-monitor"
	DefaultDepth 8
	SubSection "Display"
		Depth 8
		Modes "640x480"
	EndSubSection
EndSection
